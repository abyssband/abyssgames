<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Abyss OpenWorld 實驗預覽：3D 紙娃娃、居家生活與 FPS HUD。"><title>Abyss · 小日子 Web 預覽</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#1e2b2e;color:#fff;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#172427}h1{font-size:17px;margin:0}small{color:#acc2bb}#stage{position:relative;flex:1;min-height:160px}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;right:10px;top:10px;margin:0;padding:10px 12px;background:#101b21e8;border:1px solid #668d8066;border-radius:10px;font:12px/1.55 ui-monospace,monospace;pointer-events:none;text-shadow:0 1px 2px #000;white-space:pre-wrap}#status{position:absolute;left:12px;bottom:10px;max-width:90%;padding:7px 12px;background:#101b21dc;border-radius:8px;font-size:13px;pointer-events:none}nav{padding:10px 12px;background:#172427;display:flex;gap:8px;flex-wrap:wrap}button,select{min-height:44px;border:1px solid #607d7266;border-radius:10px;background:#314b46;color:#fff;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}button:active{background:#718d68}button:disabled{opacity:.4}#stats{font-size:13px;margin-top:4px;color:#c0d2c9}#error{color:#ffc4a2} @media(max-width:600px){#hud{font-size:10px;max-width:210px}nav{gap:5px;padding:6px}button{font-size:12px;padding:6px 10px}header{padding:7px 12px}}
</style>
<header><div><h1>小日子 <small>／ OpenWorld 預覽 · 2026.09.28</small></h1><div id="stats">載入角色與世界…</div></div><select id="quality" aria-label="畫面解析度"><option value="1.5">均衡畫質</option><option value="1">省電</option><option value="2">清晰</option></select></header>
<div id="stage"><canvas id="canvas" aria-label="3D 世界，點選家具互動"></canvas><pre id="hud">WASM 載入中</pre><div id="status">使用目前 M7 角色 · 點選家具開始生活</div></div>
<nav id="controls" aria-label="世界控制"><button data-c="0">暫停／繼續</button><button data-c="1">速度</button><button data-c="2">自主生活</button><button data-c="20">吃飯</button><button data-c="21">休息</button><button data-c="22">休閒</button><button data-c="23">工作</button><button data-c="30">室內／戶外</button><button data-c="4">取消</button><button data-c="10">倒轉 5 秒</button><button data-c="6">居家服</button><button data-c="7">戶外服</button><button data-c="5">儲存</button><a href="../../" style="align-self:center;color:#c0d2c9">AbyssGames</a><a href="https://github.com/abyssband/abyssgames/issues" target="_blank" rel="noopener" style="align-self:center;color:#c0d2c9">回報問題</a></nav><div id="error" role="alert"></div>
<script>
'use strict';
const canvas=document.querySelector('canvas'),hud=document.querySelector('#hud'),statusLine=document.querySelector('#status'),stats=document.querySelector('#stats'),error=document.querySelector('#error');
const SAVE='abyss-life-web-m7-v1';let booted=false,last=0,frames=[],cpu=[],lastHud=0,persisted='',storageError='',suspended=false;
document.querySelectorAll('button').forEach(b=>b.disabled=true);
function fail(e){error.textContent=String(e);}
function persist(){if(!booted)return;try{const bytes=Module.FS.readFile('/journey.json',{encoding:'utf8'});if(bytes!==persisted){localStorage.setItem(SAVE,bytes);persisted=bytes;}storageError='';}catch(e){storageError='瀏覽器儲存失敗，請保留分頁';fail(storageError+': '+e.message);}}
var Module={canvas,preRun:[()=>{try{const saved=localStorage.getItem(SAVE);if(saved){Module.FS.writeFile('/journey.json',saved);persisted=saved;}}catch(e){fail('無法讀取本機存檔：'+e.message);}}],onRuntimeInitialized:()=>{booted=true;},printErr:fail,onAbort:fail};
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,Number(document.querySelector('#quality').value));canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));}
new ResizeObserver(resize).observe(canvas);document.querySelector('#quality').onchange=resize;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Module._web_control(Number(b.dataset.c));persist();});
canvas.addEventListener('pointerup',e=>{if(!booted)return;const r=canvas.getBoundingClientRect();Module._web_pointer(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top),Math.round(r.width),Math.round(r.height));});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();suspended=true;persist();fail('圖形內容已中斷，請重新載入以恢復存檔。');});
document.addEventListener('visibilitychange',()=>{last=0;frames=[];cpu=[];if(booted){Module._web_suspend();persist();}});window.addEventListener('pagehide',()=>{if(booted){Module._web_suspend();persist();}});
const percentile=(a,p)=>a.length?[...a].sort((x,y)=>x-y)[Math.min(a.length-1,Math.floor(a.length*p))]:0;
function tick(t){requestAnimationFrame(tick);if(!booted||document.hidden||suspended){last=0;return;}if(last){frames.push(t-last);if(frames.length>120)frames.shift();}last=t;
 if(t-lastHud<500)return;lastHud=t;
 try{const s=JSON.parse(Module.UTF8ToString(Module._web_state()));window.abyssPreviewState=s;document.querySelectorAll('button').forEach(b=>b.disabled=!s.ready);if(!s.ready){fail(s.notice||'場景無法啟動');return;}
 cpu.push(s.cpu_ms);if(cpu.length>120)cpu.shift();const fps=frames.length?1000*frames.length/frames.reduce((a,b)=>a+b,0):0;
 const memory=Module.HEAPU8?Module.HEAPU8.length/1048576:0;
 hud.textContent=`${fps.toFixed(1)} FPS · WebGL 2\nFrame p50 ${percentile(frames,.5).toFixed(1)} / p95 ${percentile(frames,.95).toFixed(1)} ms\nCPU ${s.cpu_ms.toFixed(2)} ms（更新＋提交）\n${s.triangles.toLocaleString()} tris · ${s.draws} draws\n${canvas.width} × ${canvas.height} · DPR ${(canvas.width/canvas.clientWidth).toFixed(2)}\nWASM heap ${memory.toFixed(1)} MiB\nGPU 時間未量測 · ${s.scene.includes('/yard/')?'戶外':'居家'}`;
 stats.textContent=`${s.paused?'已暫停':'進行中'} · ${s.speed||1}× · ${s.autonomous?'自主':'手動'} · 瀏覽器獨立存檔`;
 statusLine.textContent=storageError||s.notice||'點選家具互動；室內／戶外按鈕會走向門口';persist();
 }catch(e){fail(e.message);}}
requestAnimationFrame(tick);
</script><script src="life.js"></script></html>
