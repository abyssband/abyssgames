<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Abyss OpenWorld 實驗預覽：3D 紙娃娃、居家生活與 FPS HUD。"><title>Abyss · 小日子 Web 預覽</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#1e2b2e;color:#fff;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#172427}.settings{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}header>div{min-width:0}h1{font-size:17px;margin:0}small{color:#acc2bb}#stage{position:relative;flex:1;min-height:160px}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;right:10px;top:10px;margin:0;padding:10px 12px;background:#101b21e8;border:1px solid #668d8066;border-radius:10px;font:12px/1.55 ui-monospace,monospace;pointer-events:none;text-shadow:0 1px 2px #000;white-space:pre-wrap}#status{position:absolute;left:12px;bottom:10px;max-width:90%;padding:7px 12px;background:#101b21dc;border-radius:8px;font-size:13px;pointer-events:none}nav{padding:10px 12px;background:#172427;display:flex;gap:8px;flex-wrap:wrap}button,select{min-height:44px;border:1px solid #607d7266;border-radius:10px;background:#314b46;color:#fff;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}button:active{background:#718d68}button:disabled{opacity:.4}#stats{font-size:13px;margin-top:4px;color:#c0d2c9}#error{color:#ffc4a2} @media(max-width:600px){#hud{font-size:10px;max-width:210px}nav{gap:5px;padding:6px}button{font-size:12px;padding:6px 10px}header{padding:7px 12px}}

#loading{position:absolute;inset:0;z-index:3;display:grid;place-content:center;text-align:center;gap:16px;padding:24px;background:#172427f2;backdrop-filter:blur(4px)}#loading[hidden]{display:none}.spinner{width:42px;height:42px;border:3px solid #688a7755;border-top-color:#c4dab2;border-radius:50%;margin:auto;animation:spin 1s linear infinite}#loading.failed .spinner{display:none}#loading progress{width:min(320px,70vw);accent-color:#c4dab2;margin:auto}#loading p{margin:0;color:#bed0c7;max-width:420px;overflow-wrap:anywhere}#retry[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:#c4dab2}}
</style>
<header><div><h1><span data-i18n="title"></span> <small data-i18n="preview"></small><small> · 2026.09.28.3</small></h1><div id="stats"></div></div><div class="settings"><select id="language" aria-label="Language / 語言"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option></select><select id="quality" data-label="quality"><option value="1.5" data-i18n="balanced"></option><option value="1" data-i18n="battery"></option><option value="2" data-i18n="crisp"></option></select></div></header>
<div id="stage" aria-busy="true"><canvas id="canvas" data-label="canvas"></canvas><pre id="hud"></pre><div id="status"></div><div id="loading" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><strong id="load-title"></strong><progress id="load-progress" data-label="loading"></progress><p id="load-detail"></p><button id="retry" data-i18n="retry" hidden></button></div></div>
<nav id="controls" data-label="controls"><button data-c="0"></button><button data-c="1"></button><button data-c="2"></button><button data-c="20"></button><button data-c="21"></button><button data-c="22"></button><button data-c="23"></button><button data-c="30"></button><button data-c="4"></button><button data-c="10"></button><button data-c="6"></button><button data-c="7"></button><button data-c="5"></button><a href="../../" style="align-self:center;color:#c0d2c9">AbyssGames</a><a href="https://github.com/abyssband/abyssgames/issues" target="_blank" rel="noopener" style="align-self:center;color:#c0d2c9" data-i18n="report"></a></nav><div id="error" role="alert"></div>
<script src="locale.js"></script>
<script>
'use strict';
const canvas=document.querySelector('canvas'),hud=document.querySelector('#hud'),statusLine=document.querySelector('#status'),stats=document.querySelector('#stats'),error=document.querySelector('#error');
const SAVE='abyss-life-web-m7-v1';let booted=false,last=0,frames=[],cpu=[],lastHud=0,persisted='',storageError='',suspended=false;
document.querySelectorAll('[data-c]').forEach(b=>b.disabled=true);
let loadPhase='loading',loadBytes=null,loadFailure='',loadingFinished=false;
const loading=document.querySelector('#loading'),progress=document.querySelector('#load-progress');
function renderLoading(){
 document.querySelector('#load-title').textContent=tr(loadFailure?'failed':loadPhase);
 document.querySelector('#load-detail').textContent=loadFailure?`${tr('diagnostic')}: ${loadFailure}`:loadBytes?`${num(loadBytes[0]/1048576,1)} / ${num(loadBytes[1]/1048576,1)} MB`:tr('wait');
 if(loadBytes&&!loadFailure){progress.max=loadBytes[1];progress.value=loadBytes[0];}else progress.removeAttribute('value');
 progress.hidden=!!loadFailure;loading.classList.toggle('failed',!!loadFailure);document.querySelector('#retry').hidden=!loadFailure;
}
function fail(e){error.textContent=String(e);if(!loadingFinished){loadFailure=String(e);renderLoading();}}
// Emscripten's dependency watchdog and streaming fallback are recoverable
// diagnostics, not failed loads. Keep them in the console for investigation.
function runtimeDiagnostic(message){
 const text=String(message);
 if(text==='still waiting on run dependencies:'||text==='(end of list)'||text.startsWith('dependency: ')||text.startsWith('wasm streaming compile failed: ')||text==='falling back to ArrayBuffer instantiation'){
  console.warn(text);return;
 }
 fail(text);
}
function updateLoad(message){const match=String(message).match(/([0-9]+)\/([0-9]+)/);if(match){loadPhase='downloading';loadBytes=[Number(match[1]),Number(match[2])];}else if(/Running|Preparing/.test(message)){loadPhase='initializing';loadBytes=null;}renderLoading();}
applyLocale();renderLoading();stats.textContent=tr('loading');
document.querySelector('#language').onchange=e=>{locale=e.target.value;try{localStorage.setItem('abyss-preview-language',locale);}catch{}applyLocale();renderLoading();lastHud=0;};
document.querySelector('#retry').onclick=()=>location.reload();
window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||e.reason));
window.addEventListener('error',e=>{if(e.message)fail(e.message);});
function persist(){if(!booted)return;try{const bytes=Module.FS.readFile('/journey.json',{encoding:'utf8'});if(bytes!==persisted){localStorage.setItem(SAVE,bytes);persisted=bytes;}storageError='';}catch(e){storageError=tr('saveError');fail(storageError+': '+e.message);}}
var Module={canvas,setStatus:updateLoad,preRun:[()=>{try{const saved=localStorage.getItem(SAVE);if(saved){Module.FS.writeFile('/journey.json',saved);persisted=saved;}}catch(e){fail(tr('readError')+': '+e.message);}}],onRuntimeInitialized:()=>{booted=true;loadPhase='initializing';loadBytes=null;renderLoading();},printErr:runtimeDiagnostic,onAbort:fail};
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,Number(document.querySelector('#quality').value));canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));}
new ResizeObserver(resize).observe(canvas);document.querySelector('#quality').onchange=resize;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Module._web_control(Number(b.dataset.c));persist();});
canvas.addEventListener('pointerup',e=>{if(!booted)return;const r=canvas.getBoundingClientRect();Module._web_pointer(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top),Math.round(r.width),Math.round(r.height));});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();suspended=true;persist();fail(tr('contextLost'));});
document.addEventListener('visibilitychange',()=>{last=0;frames=[];cpu=[];if(booted){Module._web_suspend();persist();}});window.addEventListener('pagehide',()=>{if(booted){Module._web_suspend();persist();}});
const percentile=(a,p)=>a.length?[...a].sort((x,y)=>x-y)[Math.min(a.length-1,Math.floor(a.length*p))]:0;
function tick(t){requestAnimationFrame(tick);if(!booted||document.hidden||suspended){last=0;return;}if(last){frames.push(t-last);if(frames.length>120)frames.shift();}last=t;
 if(t-lastHud<500)return;lastHud=t;
 try{const s=JSON.parse(Module.UTF8ToString(Module._web_state()));window.abyssPreviewState=s;document.querySelectorAll('[data-c]').forEach(b=>b.disabled=!s.ready);if(!s.ready){fail(s.notice||tr('failed'));return;}
 loadingFinished=true;loading.hidden=true;document.querySelector('#stage').setAttribute('aria-busy','false');
 cpu.push(s.cpu_ms);if(cpu.length>120)cpu.shift();const fps=frames.length?1000*frames.length/frames.reduce((a,b)=>a+b,0):0;
 const memory=Module.HEAPU8?Module.HEAPU8.length/1048576:0;
 hud.textContent=`${num(fps,1)} FPS · WebGL 2\nFrame p50 ${num(percentile(frames,.5),1)} / p95 ${num(percentile(frames,.95),1)} ms\nCPU ${num(s.cpu_ms,2)} ms (${tr('cpu')})\n${num(s.triangles)} ${tr('tris')} · ${num(s.draws)} ${tr('draws')}\n${canvas.width} × ${canvas.height} · DPR ${(canvas.width/canvas.clientWidth).toFixed(2)}\n${tr('heap')} ${num(memory,1)} MiB\n${tr('gpu')} · ${tr(s.scene.includes('/yard/')?'yard':'home')}`;
 stats.textContent=`${tr(s.paused?'paused':'running')} · ${s.speed||1}× · ${tr(s.autonomous?'auto':'manual')} · ${tr('saveLocal')} · ${new Intl.DateTimeFormat(locale,{hour:'numeric',minute:'2-digit',timeZone:'UTC'}).format(new Date(Date.UTC(2026,0,1,0,s.minute%1440)))}`;
 statusLine.textContent=storageError||noticeText(s.notice)||tr('hint');persist();
 }catch(e){fail(e.message);}}
requestAnimationFrame(tick);
</script><script src="life.js" onerror="fail(tr('failed')+': life.js')"></script></html>
